<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AF Pro - Painel do Personal</title>
    <!-- Mantenha seus scripts e tags do index_2.html aqui -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(21, 21, 21, 0.75);
            --accent: #FF6A00;
        }
        body { background-color: var(--bg-color); color: #F3F4F6; font-family: 'Inter', sans-serif; padding: 16px; }
        .bg-af-card { background: var(--card-bg); border: 1px solid rgba(255, 106, 0, 0.2); border-radius: 1rem; }
    </style>
</head>
<body class="max-w-6xl mx-auto space-y-6">

    <header class="bg-af-card p-4 flex justify-between items-center shadow-xl">
        <div>
            <h1 class="text-xl font-black text-white">ANDREY FRANCO • ADMIN</h1>
            <p class="text-xs text-slate-400">Painel de Gestão do Estúdio</p>
        </div>
        <button onclick="location.reload()" class="bg-black/80 text-slate-300 p-2.5 rounded-xl border border-slate-800 text-xs">🔄 Atualizar</button>
    </header>

    <!-- Cards Iniciais (Ativos, Parados, Aulas de Hoje) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-af-card p-4">
            <div class="text-xs text-slate-400 font-bold uppercase">Alunos Ativos</div>
            <div class="text-2xl font-black text-white mt-1" id="dashAtivos">0</div>
        </div>
        <div class="bg-af-card p-4">
            <div class="text-xs text-slate-400 font-bold uppercase">Alunos Parados (7+ dias)</div>
            <div class="text-2xl font-black text-rose-400 mt-1" id="dashParados">0</div>
        </div>
        <div class="bg-af-card p-4">
            <div class="text-xs text-slate-400 font-bold uppercase">Aulas de Hoje</div>
            <div class="text-2xl font-black text-amber-400 mt-1" id="dashAulasHoje">0</div>
        </div>
    </div>

    <!-- Cadastro e Financeiro Integrado -->
    <div class="bg-af-card p-6 space-y-4">
        <h2 class="font-bold text-sm uppercase tracking-wider text-orange-500">Cadastrar Aluno & Regra Financeira</h2>
        
        <div>
            <label class="block text-xs text-slate-400 mb-1 font-bold">Nome do Aluno</label>
            <input type="text" id="cadNome" placeholder="Nome completo..." class="w-full bg-black border border-slate-800 rounded-xl p-3 text-white text-sm">
        </div>

        <div>
            <label class="block text-xs text-slate-400 mb-1 font-bold">Modalidade</label>
            <select id="cadModalidade" onchange="toggleModalidadeFinanceira()" class="w-full bg-black border border-slate-800 rounded-xl p-3 text-white text-sm">
                <option value="online">Consultoria Online</option>
                <option value="presencial">Presencial</option>
            </select>
        </div>

        <!-- Campos para Consultoria Online -->
        <div id="blocoOnline">
            <label class="block text-xs text-slate-400 mb-1 font-bold">Valor Mensal Fixo (R$)</label>
            <input type="number" id="cadValorOnline" placeholder="Ex: 350.00" class="w-full bg-black border border-slate-800 rounded-xl p-3 text-white text-sm">
        </div>

        <!-- Campos para Presencial (com cálculo de média de hora-aula) -->
        <div id="blocoPresencial" style="display: none;" class="space-y-3">
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-bold">Valor Mensal (R$)</label>
                <input type="number" id="cadValorPresencial" placeholder="Ex: 600.00" oninput="calcularMediaHoraAula()" class="w-full bg-black border border-slate-800 rounded-xl p-3 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-bold">Quantidade de Aulas no Mês</label>
                <input type="number" id="cadAulasMes" placeholder="Ex: 12" oninput="calcularMediaHoraAula()" class="w-full bg-black border border-slate-800 rounded-xl p-3 text-white text-sm">
            </div>
            <div id="mediaHoraAulaDisplay" class="text-xs text-emerald-400 font-bold"></div>
        </div>

        <button onclick="salvarNovoAlunoAdmin()" class="w-full bg-orange-600 hover:bg-orange-500 text-black font-black py-3 rounded-xl text-sm transition-all shadow-md">Salvar Cadastro</button>
    </div>

    <script>
        function toggleModalidadeFinanceira() {
            const mod = document.getElementById('cadModalidade').value;
            document.getElementById('blocoOnline').style.display = mod === 'online' ? 'block' : 'none';
            document.getElementById('blocoPresencial').style.display = mod === 'presencial' ? 'block' : 'none';
        }

        function calcularMediaHoraAula() {
            const valor = parseFloat(document.getElementById('cadValorPresencial').value) || 0;
            const aulas = parseInt(document.getElementById('cadAulasMes').value) || 1;
            const media = valor / aulas;
            document.getElementById('mediaHoraAulaDisplay').innerText = `Média estimada por hora-aula: R$ ${media.toFixed(2)}`;
        }

        function salvarNovoAlunoAdmin() {
            alert('Aluno e dados financeiros salvos com sucesso!');
        }
    </script>
</body>
</html>

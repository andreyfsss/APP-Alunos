<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AF Pro - Painel do Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-slate-100 min-h-screen p-3 md:p-6 flex flex-col items-center antialiased">

    <div class="max-w-md w-full space-y-5">
        <!-- Topo -->
        <div class="flex justify-between items-center bg-slate-950 border border-slate-900 rounded-2xl p-4 shadow-xl">
            <div>
                <h1 class="font-black text-lg text-emerald-400 tracking-wider">AF PRO</h1>
                <p class="text-[10px] text-slate-500">Gestão de Alunos & Divisões de Treino</p>
            </div>
            <button onclick="carregarAlunos()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 p-1.5 rounded-lg border border-slate-800 text-xs">🔄</button>
        </div>

        <!-- TELA 1: LISTA DE ALUNOS -->
        <div id="view-lista-alunos" class="space-y-4">
            <div class="bg-slate-950 border border-slate-900 rounded-2xl p-4 space-y-3 shadow-lg">
                <h2 class="font-bold text-xs uppercase tracking-wider text-slate-400">Cadastrar Novo Aluno</h2>
                <div class="flex gap-2">
                    <input type="text" id="nome-novo-aluno" placeholder="Nome do aluno (ex: Juca)" class="flex-1 bg-black border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none">
                    <button onclick="cadastrarAluno()" class="bg-emerald-500 hover:bg-emerald-400 font-bold px-4 py-2.5 rounded-xl text-black text-xs transition-all shadow-md">Cadastrar</button>
                </div>
            </div>

            <div class="space-y-2">
                <h2 class="font-bold text-xs uppercase tracking-wider text-slate-400 px-1">Alunos Ativos</h2>
                <div id="container-alunos" class="space-y-2">
                    <p class="text-xs text-slate-600 text-center py-8">Carregando alunos...</p>
                </div>
            </div>
        </div>

        <!-- TELA 2: GESTÃO DO ALUNO (TREINOS POR DIVISÃO) -->
        <div id="view-detalhe-aluno" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-slate-950 border border-slate-900 rounded-2xl p-4">
                <div class="flex items-center gap-3">
                    <button onclick="voltarParaLista()" class="bg-slate-900 hover:bg-slate-800 text-slate-400 px-2.5 py-1.5 rounded-xl text-xs font-bold border border-slate-800">← Voltar</button>
                    <div>
                        <h2 id="detalhe-nome-aluno" class="font-bold text-sm text-emerald-400">Aluno</h2>
                        <p class="text-[10px] text-slate-500">Montagem de Treinos</p>
                    </div>
                </div>
                <button id="btn-copiar-link-aluno" class="text-xs bg-emerald-950/80 hover:bg-emerald-900/80 text-emerald-400 border border-emerald-800/50 px-3 py-1.5 rounded-xl font-medium transition-all">Copiar Link</button>
            </div>

            <!-- Criar Nova Divisão de Treino (Ex: Peitoral, Tríceps e Ombro) -->
            <div class="bg-slate-950 border border-slate-900 rounded-2xl p-4 space-y-3">
                <h3 class="font-bold text-xs uppercase text-slate-300">Criar Divisão de Treino</h3>
                <div class="flex gap-2">
                    <input type="text" id="input-nome-treino" placeholder="Ex: Peitoral / Tríceps / Ombro" class="flex-1 bg-black border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none">
                    <button onclick="criarTreinoDivisao()" class="bg-emerald-500 hover:bg-emerald-400 font-bold px-4 py-2.5 rounded-xl text-black text-xs">Criar Treino</button>
                </div>
            </div>

            <!-- Lista de Treinos Criados para o Aluno -->
            <div class="space-y-2">
                <h2 class="font-bold text-xs uppercase tracking-wider text-slate-400 px-1">Treinos Prescritos</h2>
                <div id="container-treinos-aluno" class="space-y-3">
                    <p class="text-xs text-slate-600 text-center py-6">Nenhum treino criado ainda.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dzifzikdeojazyswjguw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5cHNjY25mcmpma3h0Y3J1ZXh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTg3NjgsImV4cCI6MjEwODk5NDc2OH0.Y3rycAN_O1IL99OdMJsC_TRMrSEKJp4vQJho2P4D_W0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let alunoSelecionado = null;
        let treinosDoAluno = [
            { id: 't1', nome: 'Peitoral / Tríceps / Ombro', exercicios: [
                { nome: 'Supino Reto com Halteres', musculo: 'Peitoral', equipamento: 'Halter', descanso: 90, series: 4 }
            ]}
        ];

        async function carregarAlunos() {
            const { data, error } = await supabaseClient.from('alunos').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('container-alunos');
            
            if (error) {
                container.innerHTML = `<p class="text-xs text-red-400 text-center py-4">Erro ao carregar alunos.</p>`;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-600 text-center py-6">Nenhum aluno cadastrado ainda.</p>`;
                return;
            }

            const baseURL = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            container.innerHTML = data.map(aluno => {
                const linkAluno = `${baseURL}aluno.html?token=${aluno.token}`;
                const iniciais = aluno.nome.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

                return `
                    <div onclick="abrirPainelAluno('${aluno.id}', '${aluno.nome}', '${linkAluno}')" class="bg-slate-950 border border-slate-900 hover:border-emerald-500/50 p-3.5 rounded-2xl flex items-center justify-between cursor-pointer transition-all shadow-sm group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-black text-emerald-400 font-bold flex items-center justify-center text-xs border border-slate-800 group-hover:border-emerald-500/40">
                                ${iniciais}
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-200 group-hover:text-emerald-400 transition-colors">${aluno.nome}</h3>
                                <p class="text-[10px] text-slate-500">Toque para montar treinos</p>
                            </div>
                        </div>
                        <button onclick="event.stopPropagation(); copiarLinkDirect('${linkAluno}')" class="text-xs bg-slate-900 hover:bg-emerald-950 text-slate-300 hover:text-emerald-400 border border-slate-800 px-3 py-1.5 rounded-xl font-medium transition-all">
                            Copiar Link
                        </button>
                    </div>
                `;
            }).join('');
        }

        function abrirPainelAluno(id, nome, link) {
            alunoSelecionado = { id, nome, link };
            document.getElementById('detalhe-nome-aluno').innerText = nome;
            document.getElementById('btn-copiar-link-aluno').onclick = () => copiarLinkDirect(link);
            
            document.getElementById('view-lista-alunos').classList.add('hidden');
            document.getElementById('view-detalhe-aluno').classList.remove('hidden');
            renderizarTreinosAluno();
        }

        function voltarParaLista() {
            alunoSelecionado = null;
            document.getElementById('view-detalhe-aluno').classList.add('hidden');
            document.getElementById('view-lista-alunos').classList.remove('hidden');
        }

        function criarTreinoDivisao() {
            const input = document.getElementById('input-nome-treino');
            const nomeTreino = input.value.trim();
            if (!nomeTreino) {
                alert('Digite o nome da divisão de treino (ex: Peitoral, Tríceps e Ombro)');
                return;
            }

            treinosDoAluno.push({ id: 't_' + Date.now(), nome: nomeTreino, exercicios: [] });
            input.value = '';
            renderizarTreinosAluno();
        }

        function renderizarTreinosAluno() {
            const container = document.getElementById('container-treinos-aluno');
            if (treinosDoAluno.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-600 text-center py-6">Nenhum treino criado.</p>`;
                return;
            }

            container.innerHTML = treinosDoAluno.map((t, idx) => `
                <div class="bg-slate-950 border border-slate-900 rounded-2xl p-4 space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-900 pb-2">
                        <h3 class="font-bold text-xs text-emerald-400 uppercase tracking-wider">${t.nome}</h3>
                        <button onclick="adicionarExercicioAoTreino('${t.id}')" class="text-[10px] bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-slate-800 px-2.5 py-1 rounded-lg">+ Exercício</button>
                    </div>
                    <div class="space-y-2">
                        ${t.exercicios.length === 0 ? '<p class="text-[11px] text-slate-600 text-center py-2">Nenhum exercício adicionado neste treino.</p>' : 
                            t.exercicios.map((ex, exIdx) => `
                                <div class="bg-black border border-slate-900 p-2.5 rounded-xl flex justify-between items-center text-xs">
                                    <div>
                                        <span class="text-[10px] text-slate-500 font-bold">${ex.musculo} • ${ex.equipamento} • Descanso: ${ex.descanso}s</span>
                                        <div class="font-bold text-slate-200">${ex.nome} (${ex.series} Séries)</div>
                                    </div>
                                    <button onclick="removerExercicio('${t.id}', ${exIdx})" class="text-red-400 hover:text-red-300 text-xs font-bold">✕</button>
                                </div>
                            `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function adicionarExercicioAoTreino(treinoId) {
            const nomeEx = prompt('Nome do Exercício (ex: Supino Reto com Halteres):');
            if (!nomeEx) return;
            const musculo = prompt('Músculo Alvo (ex: Peitoral):', 'Peitoral');
            const equipamento = prompt('Equipamento (Halter, Barra, Máquina, Crossover):', 'Halter');
            const descanso = parseInt(prompt('Tempo de Descanso padrão em segundos (ex: 90):', '90')) || 90;
            const series = parseInt(prompt('Número de Séries:', '4')) || 4;

            const treino = treinosDoAluno.find(t => t.id === treinoId);
            if (treino) {
                treino.exercicios.push({ nome: nomeEx, musculo, equipamento, descanso, series });
                renderizarTreinosAluno();
            }
        }

        function removerExercicio(treinoId, exIndex) {
            const treino = treinosDoAluno.find(t => t.id === treinoId);
            if (treino) {
                treino.exercicios.splice(exIndex, 1);
                renderizarTreinosAluno();
            }
        }

        async function cadastrarAluno() {
            const input = document.getElementById('nome-novo-aluno');
            const nome = input.value.trim();
            if (!nome) return;

            const { error } = await supabaseClient.from('alunos').insert([{ nome }]);
            if (error) alert('Erro: ' + error.message);
            else { input.value = ''; carregarAlunos(); }
        }

        function copiarLinkDirect(link) {
            navigator.clipboard.writeText(link);
            alert('Link exclusivo do aluno copiado!');
        }

        window.onload = carregarAlunos;
    </script>
</body>
</html>

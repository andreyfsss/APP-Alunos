    <!-- Script do Mapa Muscular & Neon Chart mantidos na íntegra -->
    <script>
    window.BodyMap = (function () {
        let uid = 0;
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const MIR = 'matrix(-1 0 0 1 120 0)';
        const BRACO = [20, 82, 7.5, 17, 8];
        const R = {
            f: {
                'Ombros': { m: 1, el: [30, 54, 11, 11, 0] },
                'Peitoral': { m: 1, p: 'M44 50 L59 52 L59 82 Q47 90 36 80 Q34 62 44 50 Z' },
                'Abdômen': { m: 0, r: [47, 90, 26, 54, 7], dec: '<path class="bm-dec" d="M60 93 L60 141 M48 108 L72 108 M48 124 L72 124" stroke="rgba(0,0,0,.4)" stroke-width="1" fill="none"/>' },
                'Bíceps': { m: 1, el: BRACO },
                'Quadríceps': { m: 1, p: 'M41 152 L59 152 L58 214 Q50 221 43 214 Z' },
                'Panturrilhas': { m: 1, el: [49, 250, 7, 21, 0] }
            },
            b: {
                'Costas': { m: 0, p: 'M46 44 L74 44 L90 64 Q92 104 80 128 L40 128 Q28 104 30 64 Z' },
                'Ombros': { m: 1, el: [30, 54, 11, 11, 0] },
                'Tríceps': { m: 1, el: BRACO },
                'Glúteos': { m: 1, el: [49, 148, 12, 13, 0] },
                'Posterior': { m: 1, p: 'M41 164 L59 164 L58 218 Q50 224 43 218 Z' },
                'Panturrilhas': { m: 1, el: [49, 252, 7, 20, 0] }
            }
        };
        const NOME = { 'Posterior': 'Posterior de coxa' };
        const lado = '<path d="M30 48 Q16 52 14 70 L10 112 Q9 124 14 128 L22 128 Q26 124 26 112 L32 74 Z"/><path d="M40 148 L60 148 L58 218 L56 284 L44 284 L42 218 Z"/>';
        const SIL = '<g fill="#0b1220" stroke="#334155" stroke-width="1.2"><circle cx="60" cy="20" r="13"/><rect x="54" y="31" width="12" height="10" rx="3"/><path d="M32 46 Q60 38 88 46 L84 100 Q82 128 80 150 L40 150 Q38 128 36 100 Z"/>' + lado + '<g transform="' + MIR + '">' + lado + '</g></g>';
        if (!document.getElementById('bm-css')) {
            document.head.insertAdjacentHTML('beforeend', '<style id="bm-css">.bm-g{transition:filter .15s}.bm-g:hover path:not(.bm-dec),.bm-g:hover ellipse,.bm-g:hover rect,.bm-g.hl path:not(.bm-dec),.bm-g.hl ellipse,.bm-g.hl rect,.bm-g.sel path:not(.bm-dec),.bm-g.sel ellipse,.bm-g.sel rect{stroke:#fff !important;stroke-width:1.8 !important;filter:drop-shadow(0 0 5px #FF6A00) drop-shadow(0 0 10px rgba(255,106,0,.7))}</style>');
        }
        function forma(d, st) {
            if (d.p) return '<path d="' + d.p + '" ' + st + '/>';
            if (d.el) { const e = d.el; return '<ellipse cx="' + e[0] + '" cy="' + e[1] + '" rx="' + e[2] + '" ry="' + e[3] + '"' + (e[4] ? ' transform="rotate(' + e[4] + ' ' + e[0] + ' ' + e[1] + ')"' : '') + ' ' + st + '/>'; }
            const r = d.r; return '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" rx="' + r[4] + '" ' + st + '/>';
        }
        function regiao(nome, d, v, max, o) {
            const a = v > 0 ? (0.18 + 0.72 * v / max) : 0;
            const st = v > 0 ? 'fill="rgba(255,106,0,' + a.toFixed(2) + ')" stroke="rgba(255,106,0,' + (a > 0.3 ? 0.95 : 0.5) + ')" stroke-width="1"' : 'fill="#111a2b" stroke="#2b3a52" stroke-width="1"';
            const clic = v > 0 && o.onSelect;
            let corpo = forma(d, st) + (d.dec || '');
            if (d.m) corpo += '<g transform="' + MIR + '">' + forma(d, st) + '</g>';
            return '<g class="bm-g' + (o.selecionado === nome ? ' sel' : '') + '" data-g="' + esc(nome) + '" data-v="' + v + '"' + (clic ? ' onclick="' + o.onSelect + '(\'' + nome + '\')" style="cursor:pointer"' : '') + ' onmouseenter="BodyMap.hover(this)" onmouseleave="BodyMap.sair(this)">' + corpo + '</g>';
        }
        function padrao(o) { return o.mini ? '' : 'Passe o mouse ou toque em um músculo'; }
        function render(o) {
            o = o || {}; const v = o.valores || {}; const max = Math.max(1, ...Object.values(v).map(Number).filter(isFinite));
            const lg = o.mini ? 170 : 340;
            let svg = '<svg viewBox="0 0 250 306" style="width:100%;max-width:' + lg + 'px;display:block;margin:0 auto" role="img" aria-label="Mapa muscular">';
            svg += '<g>' + SIL + Object.keys(R.f).map(n => regiao(n, R.f[n], +v[n] || 0, max, o)).join('') + '</g>';
            svg += '<g transform="translate(130 0)">' + SIL + Object.keys(R.b).map(n => regiao(n, R.b[n], +v[n] || 0, max, o)).join('') + '</g>';
            svg += '<text x="60" y="301" text-anchor="middle" font-size="8" fill="#64748b">FRENTE</text><text x="190" y="301" text-anchor="middle" font-size="8" fill="#64748b">COSTAS</text></svg>';
            return '<div class="bm-wrap bg-black/60 border border-slate-800 rounded-xl p-3 space-y-2">' + (o.titulo ? '<div class="text-[10px] uppercase font-bold text-slate-400">' + esc(o.titulo) + '</div>' : '') + svg + '<div class="bm-info text-center text-[11px] text-slate-400" style="min-height:1.2rem" data-padrao="' + esc(padrao(o)) + '">' + esc(padrao(o)) + '</div></div>';
        }
        function textoInfo(g, v) { const nome = NOME[g] || g; return '<b style="color:#FF6A00">' + esc(nome) + '</b> • ' + (v > 0 ? v + ' séries no período' : 'sem registros'); }
        function hover(el) { const w = el.closest('.bm-wrap'); if (!w) return; const i = w.querySelector('.bm-info'); if (i && !w.classList.contains('bm-mini')) i.innerHTML = textoInfo(el.dataset.g, +el.dataset.v); }
        function sair(el) { const w = el.closest('.bm-wrap'); if (!w) return; const i = w.querySelector('.bm-info'); if (i) i.innerText = i.dataset.padrao || ''; }
        function destacar(g) { document.querySelectorAll('.bm-g').forEach(e => e.classList.toggle('hl', g !== null && e.dataset.g === g)); }
        return { render: render, hover: hover, sair: sair, destacar: destacar };
    })();
    </script>
    <script>
    window.NeonChart = (function () {
        let uid = 0; const COR = '#FF6A00'; const GRID = '#1e293b'; const TXT = '#64748b';
        const fmt = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const pad = n => String(n).padStart(2, '0');
        function caixa(titulo, direita, corpo) { return '<div class="bg-black/60 border border-slate-800 rounded-xl p-3 space-y-1.5">' + (titulo ? '<div class="flex justify-between items-center gap-2"><span class="text-[10px] uppercase font-bold text-slate-400">' + esc(titulo) + '</span>' + (direita ? '<span class="text-[10px] font-black" style="color:' + COR + '">' + esc(direita) + '</span>' : '') + '</div>' : '') + corpo + '</div>'; }
        function vazio(titulo) { return caixa(titulo, '', '<p class="text-[11px] text-slate-500 text-center py-6">Sem dados no período.</p>'); }
        function line(pts, o) {
            o = o || {}; pts = (pts || []).filter(p => isFinite(p.value)); if (!pts.length) return vazio(o.titulo);
            const f = o.fmtY || fmt, W = 320, H = o.h || 165, L = 38, R = 16, T = 18, B = 22;
            const vals = pts.map(p => p.value), min = Math.min(...vals), max = Math.max(...vals);
            const n = pts.length, x = i => L + i * (W - L - R) / Math.max(n - 1, 1), y = v => T + (max - v) * (H - T - B) / Math.max(max - min, 1);
            const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.value).toFixed(1)).join(' ');
            let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block"><path d="' + d + '" fill="none" stroke="' + COR + '" stroke-width="2.4"/>' + pts.map((p, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.value).toFixed(1) + '" r="3.5" fill="' + COR + '"/>').join('') + '</svg>';
            return caixa(o.titulo, 'Atual: ' + f(pts[n - 1].value) + (o.unit ? ' ' + o.unit : ''), svg);
        }
        function bars(pts, o) {
            o = o || {}; pts = (pts || []).filter(p => isFinite(p.value)).slice(-30); if (!pts.length) return vazio(o.titulo);
            const f = o.fmtY || fmt, W = 320, H = o.h || 150, L = 38, R = 10, T = 18, B = 22, max = Math.max(...pts.map(p => p.value), 1), n = pts.length, slot = (W - L - R) / n, bw = Math.min(30, slot * 0.62);
            let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
            pts.forEach((p, i) => {
                const cx = L + slot * i + slot / 2, h = Math.max((H - B - (T + (max - p.value) * (H - T - B) / max)), 2);
                svg += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (H - B - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="' + COR + '"/>';
            });
            svg += '</svg>';
            return caixa(o.titulo, o.somar ? 'Total: ' + f(pts.reduce((a, p) => a + p.value, 0)) + (o.unit ? ' ' + o.unit : '') : '', svg);
        }
        function somarDiaVal(mapa, data, vol, series) {
            const dt = new Date(data); if (isNaN(dt)) return;
            const k = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
            const e = mapa[k] || (mapa[k] = { k: k, d: dt, vol: 0, series: 0 }); e.vol += vol || 0; e.series += series || 0;
        }
        function somarDia(mapa, h) { somarDiaVal(mapa, h.data, h.volume || 0, h.qtdSeriesValidadas || 0); }
        function serieDias(mapa, campo) { return Object.values(mapa).sort((a, b) => a.k < b.k ? -1 : 1).map(e => ({ label: pad(e.d.getDate()) + '/' + pad(e.d.getMonth() + 1), value: e[campo] })); }
        return { line: line, bars: bars, somarDiaVal: somarDiaVal, somarDia: somarDia, serieDias: serieDias, fmt: fmt };
    })();
    </script>

    <script>
        const SUPABASE_URL = 'https://dzifzikdeojazyswjguw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6aWZ6aWtkZW9qYXp5c3dqZ3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTg3NjgsImV4cCI6MjEwODk5NDc2OH0.Y3rycAN_O1IL99OdMJsC_TRMrSEKJp4vQJho2P4D_W0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let alunoSelecionado = null;
        let alunosGlobais = [];

        function mudarAbaPrincipalAdmin(aba) {
            ['inicio', 'alunos', 'desempenho', 'financeiro', 'agenda'].forEach(x => {
                document.getElementById(`sec-adm-${x}`).classList.toggle('hidden', x !== aba);
            });
            document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('ativo', b.dataset.nav === aba));
            if (aba === 'alunos') carregarAlunos();
        }

        async function carregarAlunos() {
            const { data } = await supabaseClient.from('alunos').select('*').order('created_at', { ascending: false });
            alunosGlobais = data || [];
            const container = document.getElementById('container-alunos');
            const baseURL = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

            container.innerHTML = alunosGlobais.map(aluno => {
                const linkAluno = `${baseURL}aluno.html?token=${aluno.token}`;
                return `
                    <div onclick="abrirPainelAluno('${aluno.id}', '${aluno.nome}', '${aluno.token}', '${linkAluno}')" class="bg-af-card p-3.5 rounded-2xl flex items-center justify-between cursor-pointer">
                        <span class="font-bold text-sm text-slate-200">${aluno.nome}</span>
                        <span class="text-xs text-af-orange font-bold">Ver Ficha →</span>
                    </div>
                `;
            }).join('');
        }

        async function abrirPainelAluno(id, nome, token, link) {
            alunoSelecionado = { id, nome, token, link };
            document.getElementById('detalhe-nome-aluno').innerText = nome;
            document.getElementById('btn-copiar-link-aluno').onclick = () => { navigator.clipboard.writeText(link); alert('Link copiado!'); };
            document.getElementById('view-lista-alunos').classList.add('hidden');
            document.getElementById('view-detalhe-aluno').classList.remove('hidden');

            const { data } = await supabaseClient.from('alunos').select('treinos, historico').eq('id', id).single();
            const historico = (data && data.historico) || [];

            // Exibição do Histórico com Alerta de Escolha / Troca de Estratégia
            const histEl = document.getElementById('historico-estrategias-aluno');
            if (historico.length === 0) {
                histEl.innerHTML = `<p class="text-xs text-slate-500 text-center">Nenhum treino concluído ainda.</p>`;
            } else {
                histEl.innerHTML = historico.slice().reverse().map(h => {
                    const dt = new Date(h.data).toLocaleDateString('pt-BR');
                    const exercicios = h.exerciciosRealizados || [];
                    return `
                        <div class="bg-black/60 border border-slate-800 p-3 rounded-xl space-y-1">
                            <div class="flex justify-between text-xs font-bold text-slate-300">
                                <span>📅 ${dt} • ${h.treinoNome || 'Treino'}</span>
                                <span class="text-af-orange">${h.volume || 0} kg</span>
                            </div>
                            <div class="space-y-1 pt-1">
                                ${exercicios.map(ex => `
                                    <div class="text-[11px] text-slate-400 flex justify-between items-center">
                                        <span>${ex.nome}</span>
                                        <div>
                                            <span style="color: var(--accent); font-weight: 700;">${ex.estrategiaEvolucao || 'Livre'}</span>
                                            ${ex.trocouEstrategia ? '<span style="color: #F59E0B; font-weight: bold; margin-left: 4px;" title="O aluno mudou de opção durante o exercício">⚠️ Trocou Opção</span>' : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function voltarParaLista() {
            document.getElementById('view-detalhe-aluno').classList.add('hidden');
            document.getElementById('view-lista-alunos').classList.remove('hidden');
            carregarAlunos();
        }

        async function cadastrarAluno() {
            const input = document.getElementById('nome-novo-aluno');
            const nome = input.value.trim();
            if (!nome) return;
            const token = crypto.randomUUID();
            await supabaseClient.from('alunos').insert([{ nome, token, treinos: [], historico: [], arquivado: false }]);
            input.value = '';
            carregarAlunos();
        }

        window.onload = () => { mudarAbaPrincipalAdmin('inicio'); carregarAlunos(); };
    </script>
</body>
</html>

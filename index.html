<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="max-w-md w-full space-y-6">
        <!-- Cabeçalho -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center shadow-lg">
            <h1 class="font-bold text-xl text-emerald-400">Painel do Personal</h1>
            <p class="text-xs text-slate-400 mt-1">Gerencie seus alunos e gere os links de acesso exclusivo.</p>
        </div>

        <!-- Cadastrar Novo Aluno -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 shadow-lg">
            <h2 class="font-bold text-sm text-slate-200">Adicionar Novo Aluno</h2>
            <div class="flex gap-2">
                <input type="text" id="nome-novo-aluno" placeholder="Nome do aluno (ex: João)" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none">
                <button onclick="cadastrarAluno()" class="bg-emerald-500 hover:bg-emerald-400 font-bold px-4 py-2.5 rounded-lg text-slate-950 text-sm transition-all shadow-md">Cadastrar</button>
            </div>
        </div>

        <!-- Lista de Alunos e Links -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 shadow-lg">
            <h2 class="font-bold text-sm text-slate-200">Seus Alunos Cadastrados</h2>
            <div id="lista-alunos" class="space-y-2">
                <p class="text-xs text-slate-500 text-center py-4">Carregando alunos...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dzifzikdeojazyswjguw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6aWZ6aWtkZW9qYXp5c3dqZ3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTg3NjgsImV4cCI6MjEwODk5NDc2OH0.Y3rycAN_O1IL99OdMJsC_TRMrSEKJp4vQJho2P4D_W0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarAlunos() {
            const { data, error } = await supabaseClient.from('alunos').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('lista-alunos');
            
            if (error) {
                container.innerHTML = `<p class="text-xs text-red-400 text-center">Erro ao carregar alunos.</p>`;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Nenhum aluno cadastrado ainda.</p>`;
                return;
            }

            const baseURL = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

            container.innerHTML = data.map(aluno => {
                const linkAluno = `${baseURL}aluno.html?token=${aluno.token}`;
                return `
                    <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg flex flex-col gap-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-sm text-slate-200">${aluno.nome}</span>
                            <button onclick="copiarLink('${linkAluno}')" class="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 px-3 py-1.5 rounded font-medium transition-all">Copiar Link</button>
                        </div>
                        <input type="text" readonly value="${linkAluno}" class="bg-slate-900 border border-slate-800/60 rounded p-1.5 text-[10px] text-slate-400 select-all">
                    </div>
                `;
            }).join('');
        }

        async function cadastrarAluno() {
            const input = document.getElementById('nome-novo-aluno');
            const nome = input.value.trim();

            if (!nome) {
                alert('Digite o nome do aluno!');
                return;
            }

            const { error } = await supabaseClient.from('alunos').insert([{ nome }]);

            if (error) {
                alert('Erro ao cadastrar: ' + error.message);
            } else {
                input.value = '';
                carregarAlunos();
            }
        }

        function copiarLink(link) {
            navigator.clipboard.writeText(link);
            alert('Link copiado para a área de transferência!');
        }

        window.onload = carregarAlunos;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AF Pro - Treino do Aluno</title>
    <link rel="manifest" href="manifest.webmanifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AF Pro">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050505; -webkit-text-size-adjust: 100%; }
        .bg-af-card { background: rgba(255,255,255,.035); backdrop-filter: blur(14px); border: 1px solid rgba(255,106,0,.17); }
        .text-af-orange { color: #FF6A00; }
        .bg-af-orange { background-color: #FF6A00; }
        .border-af-orange { border-color: #FF6A00; }
        input, select, textarea { font-size: 16px !important; }
        html { touch-action: manipulation; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-3 md:p-6 flex flex-col items-center antialiased pb-24">
    <div id="app-shell" class="w-full max-w-md space-y-4">
        
        <!-- TOPO / IDENTIFICAÇÃO -->
        <div class="bg-af-card rounded-2xl p-4 flex justify-between items-center shadow-lg">
            <div>
                <span class="text-[10px] font-black text-af-orange tracking-widest bg-orange-950/60 px-2 py-0.5 rounded border border-orange-600/40 uppercase">Área do Aluno</span>
                <h1 id="aluno-nome-topo" class="text-xl font-black text-white mt-1">Carregando...</h1>
            </div>
            <button onclick="carregarDadosAluno()" class="bg-black/80 text-slate-300 p-2.5 rounded-xl border border-slate-800 text-xs">🔄</button>
        </div>

        <!-- CRONÔMETRO FLUTUANTE DE DESCANSO -->
        <div id="card-cronometro" class="hidden bg-af-card border-2 border-af-orange rounded-2xl p-4 text-center space-y-2 shadow-2xl animate-pulse">
            <span class="text-[10px] font-bold text-af-orange uppercase tracking-wider">⏱️ Descanso entre Séries</span>
            <div id="display-tempo-cronometro" class="text-3xl font-black text-white">01:30</div>
            <div class="flex gap-2 justify-center pt-1">
                <button onclick="ajustarTempoCronometro(-15)" class="bg-black/80 border border-slate-800 px-3 py-1 rounded-lg text-xs font-bold text-slate-300">-15s</button>
                <button onclick="pararCronometro()" class="bg-rose-950 text-rose-400 border border-rose-800 px-4 py-1 rounded-lg text-xs font-bold">Pular</button>
                <button onclick="ajustarTempoCronometro(15)" class="bg-black/80 border border-slate-800 px-3 py-1 rounded-lg text-xs font-bold text-slate-300">+15s</button>
            </div>
        </div>

        <!-- LISTA DE DIVISÕES DE TREINO -->
        <div id="sec-lista-treinos" class="space-y-3">
            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-400 px-1">Selecione o Treino de Hoje</h2>
            <div id="container-divisoes-aluno" class="space-y-2.5">
                <p class="text-xs text-slate-500 text-center py-8">Carregando divisões de treino...</p>
            </div>
        </div>

        <!-- EXECUÇÃO DO TREINO ATIVO -->
        <div id="sec-execucao-treino" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-af-card rounded-2xl p-4">
                <button onclick="voltarParaListaTreinos()" class="bg-black text-slate-400 px-3 py-2 rounded-xl text-xs font-bold border border-slate-800">← Voltar</button>
                <h2 id="titulo-treino-execucao" class="font-bold text-sm text-af-orange uppercase tracking-wider">Treino</h2>
                <button onclick="finalizarTreinoDefinitivo()" class="bg-emerald-500 hover:bg-emerald-600 text-black font-black px-4 py-2 rounded-xl text-xs shadow-lg">Finalizar 🎯</button>
            </div>

            <div id="container-exercicios-execucao" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dzifzikdeojazyswjguw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6aWZ6aWtkZW9qYXp5c3dqZ3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTg3NjgsImV4cCI6MjEwODk5NDc2OH0.Y3rycAN_O1IL99OdMJsC_TRMrSEKJp4vQJho2P4D_W0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let alunoDados = null;
        let treinoAtivoExecucao = null;
        let progressoExecucao = {}; // Guarda { [exercicioIdx]: { [serieIdx]: { carga, reps, rpe, concluida } } }
        let cronometroInterval = null;
        let segundosRestantes = 0;

        function obterTokenUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        async function carregarDadosAluno() {
            const token = obterTokenUrl();
            if (!token) {
                document.getElementById('aluno-nome-topo').innerText = 'Token não informado';
                return;
            }
            try {
                const { data, error } = await supabaseClient.from('alunos').select('*').eq('token', token).single();
                if (error || !data) throw new Error('Aluno não encontrado');
                alunoDados = data;
                document.getElementById('aluno-nome-topo').innerText = alunoDados.nome;
                renderizarDivisoesAluno();
            } catch (err) {
                document.getElementById('aluno-nome-topo').innerText = 'Erro ao carregar dados';
            }
        }

        function renderizarDivisoesAluno() {
            const container = document.getElementById('container-divisoes-aluno');
            const treinos = alunoDados.treinos || [];
            if (!treinos.length) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Nenhum treino prescrito pelo personal ainda.</p>`;
                return;
            }
            container.innerHTML = treinos.map(t => `
                <div onclick="iniciarTreino('${t.id}')" class="bg-af-card hover:border-af-orange/60 p-4 rounded-2xl flex justify-between items-center cursor-pointer transition-all shadow-md">
                    <div>
                        <h3 class="font-bold text-sm text-slate-100">${escapeHtml(t.nome)}</h3>
                        <p class="text-[10px] text-slate-400">${t.exercicios ? t.exercicios.length : 0} exercício(s) prescrito(s)</p>
                    </div>
                    <span class="bg-af-orange text-black font-black px-3.5 py-2 rounded-xl text-xs">Iniciar →</span>
                </div>
            `).join('');
        }

        function iniciarTreino(treinoId) {
            treinoAtivoExecucao = alunoDados.treinos.find(t => t.id === treinoId);
            if (!treinoAtivoExecucao) return;
            progressoExecucao = {};
            document.getElementById('titulo-treino-execucao').innerText = treinoAtivoExecucao.nome;
            document.getElementById('sec-lista-treinos').classList.add('hidden');
            document.getElementById('sec-execucao-treino').classList.remove('hidden');
            renderizarExerciciosExecucao();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function voltarParaListaTreinos() {
            treinoAtivoExecucao = null;
            document.getElementById('sec-execucao-treino').classList.add('hidden');
            document.getElementById('sec-lista-treinos').classList.remove('hidden');
        }

        function renderizarExerciciosExecucao() {
            const container = document.getElementById('container-exercicios-execucao');
            const exercicios = treinoAtivoExecucao.exercicios || [];
            if (!exercicios.length) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Nenhum exercício nesta divisão.</p>`;
                return;
            }

            container.innerHTML = exercicios.map((ex, exIdx) => {
                const seriesConfig = ex.seriesConfig || Array.from({ length: ex.qtdSeries || 4 }, (_, i) => ({ num: i + 1, metodo: 'Série Normal', repsSugeridas: '10 a 12', descanso: ex.descanso || 90 }));
                const exigeRpe = ex.exigeRpe !== false;
                const conj = ex.conjugado && ex.conjugado !== 'Nenhum' ? ex.conjugado : null;

                let seriesHtml = seriesConfig.map((s, sIdx) => {
                    if (!progressoExecucao[exIdx]) progressoExecucao[exIdx] = {};
                    if (!progressoExecucao[exIdx][sIdx]) progressoExecucao[exIdx][sIdx] = { carga: '', reps: '', rpe: '', concluida: false };
                    const p = progressoExecucao[exIdx][sIdx];

                    const isDrop = s.metodo === 'Drop Set';
                    const qtdDrops = s.qtdDrops || 1;

                    let dropInputsHtml = '';
                    if (isDrop) {
                        for (let d = 1; d <= qtdDrops; d++) {
                            dropInputsHtml += `
                                <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-800/60 pl-3">
                                    <div><label class="text-[9px] text-amber-400 font-bold block">Drop ${d} - Carga (kg)</label><input type="number" inputmode="decimal" placeholder="kg" class="w-full bg-black border border-slate-800 rounded-xl p-2 text-white text-center text-xs"></div>
                                    <div><label class="text-[9px] text-amber-400 font-bold block">Drop ${d} - Reps</label><input type="number" inputmode="numeric" placeholder="reps" class="w-full bg-black border border-slate-800 rounded-xl p-2 text-white text-center text-xs"></div>
                                </div>
                            `;
                        }
                    }

                    return `
                        <div class="bg-black/60 border ${p.concluida ? 'border-emerald-500/60 bg-emerald-950/10' : 'border-slate-800'} rounded-xl p-3 space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold text-af-orange">Série ${s.num} (${s.metodo || 'Normal'})</span>
                                <span class="text-slate-400">Meta: <b>${s.repsSugeridas || '10 a 12'}</b></span>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="block text-[9px] text-slate-400 uppercase font-bold mb-1">Carga (kg)</label>
                                    <input type="number" inputmode="decimal" value="${p.carga}" oninput="atualizarProgressoSerie(${exIdx}, ${sIdx}, 'carga', this.value)" placeholder="0" class="w-full bg-black border border-slate-800 rounded-xl p-2.5 text-white text-center font-bold text-xs">
                                </div>
                                <div>
                                    <label class="block text-[9px] text-slate-400 uppercase font-bold mb-1">Reps</label>
                                    <input type="number" inputmode="numeric" value="${p.reps}" oninput="atualizarProgressoSerie(${exIdx}, ${sIdx}, 'reps', this.value)" placeholder="0" class="w-full bg-black border border-slate-800 rounded-xl p-2.5 text-white text-center font-bold text-xs">
                                </div>
                                ${exigeRpe ? `
                                <div>
                                    <label class="block text-[9px] text-slate-400 uppercase font-bold mb-1">RPE (6-10)</label>
                                    <input type="number" inputmode="decimal" value="${p.rpe}" oninput="atualizarProgressoSerie(${exIdx}, ${sIdx}, 'rpe', this.value)" placeholder="8" class="w-full bg-black border border-slate-800 rounded-xl p-2.5 text-white text-center font-bold text-xs">
                                </div>` : ''}
                            </div>
                            ${dropInputsHtml}
                            <button onclick="concluirSerie(${exIdx}, ${sIdx}, ${s.descanso || 90})" class="w-full py-2 rounded-xl font-bold text-xs transition-all ${p.concluida ? 'bg-emerald-500 text-black shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-300 hover:border-af-orange'}">
                                ${p.concluida ? '✅ Série Concluida (Toque para refazer)' : 'Concluir Série ⏱️'}
                            </button>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-af-card rounded-2xl p-4 space-y-3 shadow-lg">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <div>
                                <span class="text-[10px] text-af-orange font-bold uppercase">${escapeHtml(ex.musculo)} • ${escapeHtml(ex.equipamento)}</span>
                                <h3 class="font-bold text-sm text-white">${exIdx + 1}. ${escapeHtml(ex.nome)}</h3>
                            </div>
                            ${conj ? `<span class="text-[10px] bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded font-black">🔗 ${conj}</span>` : ''}
                        </div>
                        <div class="space-y-2">${seriesHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function atualizarProgressoSerie(exIdx, sIdx, campo, valor) {
            if (!progressoExecucao[exIdx]) progressoExecucao[exIdx] = {};
            if (!progressoExecucao[exIdx][sIdx]) progressoExecucao[exIdx][sIdx] = { carga: '', reps: '', rpe: '', concluida: false };
            progressoExecucao[exIdx][sIdx][campo] = valor;
        }

        function concluirSerie(exIdx, sIdx, segundosDescanso) {
            if (!progressoExecucao[exIdx]) progressoExecucao[exIdx] = {};
            if (!progressoExecucao[exIdx][sIdx]) progressoExecucao[exIdx][sIdx] = { carga: '', reps: '', rpe: '', concluida: false };
            
            const p = progressoExecucao[exIdx][sIdx];
            p.concluida = !p.concluida;
            renderizarExerciciosExecucao();

            if (p.concluida && segundosDescanso > 0) {
                iniciarCronometro(segundosDescanso);
            }
        }

        // ===== CRONÔMETRO COM ALARME SONORO E VIBRAÇÃO =====
        function iniciarCronometro(segundos) {
            segundosRestantes = segundos;
            const card = document.getElementById('card-cronometro');
            card.classList.remove('hidden');
            atualizarDisplayCronometro();

            if (cronometroInterval) clearInterval(cronometroInterval);
            cronometroInterval = setInterval(() => {
                segundosRestantes--;
                if (segundosRestantes <= 0) {
                    clearInterval(cronometroInterval);
                    dispararAlarmeConclusao();
                    card.classList.add('hidden');
                } else {
                    atualizarDisplayCronometro();
                }
            }, 1000);
        }

        function pararCronometro() {
            if (cronometroInterval) clearInterval(cronometroInterval);
            document.getElementById('card-cronometro').classList.add('hidden');
        }

        function ajustarTempoCronometro(delta) {
            segundosRestantes = Math.max(0, segundosRestantes + delta);
            atualizarDisplayCronometro();
        }

        function atualizarDisplayCronometro() {
            const m = Math.floor(segundosRestantes / 60);
            const s = segundosRestantes % 60;
            document.getElementById('display-tempo-cronometro').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function dispararAlarmeConclusao() {
            // Vibração nativa no celular
            if ('vibrate' in navigator) {
                try { navigator.vibrate([300, 150, 300, 150, 500]); } catch (e) {}
            }
            // Alarme sonoro sintetizado (Web Audio API)
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // Tom agudo
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch (e) {}
        }

        async function finalizarTreinoDefinitivo() {
            if (!confirm("Deseja finalizar o treino e enviar o registro para o personal?")) return;
            
            let volumeTotal = 0;
            let seriesValidadas = 0;
            const exerciciosRealizados = [];

            (treinoAtivoExecucao.exercicios || []).forEach((ex, exIdx) => {
                const seriesProg = progressoExecucao[exIdx] || {};
                const seriesRealizadas = [];
                let volEx = 0;

                Object.keys(seriesProg).forEach(sIdx => {
                    const s = seriesProg[sIdx];
                    if (s && s.concluida) {
                        const carga = parseFloat(s.carga) || 0;
                        const reps = parseInt(s.reps) || 0;
                        const rpe = parseFloat(s.rpe) || null;
                        volEx += carga * reps;
                        seriesValidadas++;
                        seriesRealizadas.push({ carga, reps, rpe });
                    }
                });

                volumeTotal += volEx;
                exerciciosRealizados.push({
                    nome: ex.nome,
                    musculo: ex.musculo,
                    volume: volEx,
                    series: seriesRealizadas
                });
            });

            const novoRegistro = {
                data: new Date().toISOString(),
                treinoId: treinoAtivoExecucao.id,
                treinoNome: treinoAtivoExecucao.nome,
                volume: volumeTotal,
                qtdSeriesValidadas: seriesValidadas,
                comparativo: 'mais',
                exerciciosRealizados
            };

            const historicoAtual = Array.isArray(alunoDados.historico) ? alunoDados.historico : [];
            historicoAtual.push(novoRegistro);

            try {
                const { error } = await supabaseClient.from('alunos').update({ historico: historicoAtual }).eq('id', alunoDados.id);
                if (error) throw error;
                alert('Treino finalizado e salvo com sucesso! Bom descanso! 💪');
                voltarParaListaTreinos();
                carregarDadosAluno();
            } catch (err) {
                alert('Erro ao salvar treino: ' + err.message);
            }
        }

        function escapeHtml(t) { return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        window.onload = () => { carregarDadosAluno(); };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFPRO - Treino do Aluno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(18, 19, 23, 0.92);
            --card-solid: #121317;
            --card-border: rgba(252, 109, 2, 0.22);
            --card-border-subtle: rgba(255, 255, 255, 0.08);
            --accent: #FC6D02;
            --accent-bright: #FF8524;
            --accent-glow: rgba(252, 109, 2, 0.28);
            --text-main: #F5F5F7;
            --text-muted: #9CA3AF;
            --success: #10B981;
            --danger: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 85% 5%, rgba(252, 109, 2, 0.14), transparent 48%),
                radial-gradient(circle at 10% 95%, rgba(252, 109, 2, 0.09), transparent 52%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 110px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
            position: sticky;
            top: 12px;
            z-index: 50;
        }
        .brand-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
        .brand-badge {
            font-size: 0.62rem; font-weight: 900; letter-spacing: 0.08em; color: var(--accent);
            background: rgba(252, 109, 2, 0.14); border: 1px solid rgba(252, 109, 2, 0.38);
            padding: 2px 7px; border-radius: 6px; text-transform: uppercase;
        }
        .workout-title { font-size: 1.05rem; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em; }
        .workout-subinfo { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .workout-timer, .workout-volume {
            font-size: 0.78rem; color: var(--accent); font-weight: 800;
            background: rgba(252, 109, 2, 0.14); border: 1px solid rgba(252, 109, 2, 0.3);
            padding: 3px 8px; border-radius: 7px; display: inline-block;
        }
        .workout-volume { color: var(--success); background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.3); }

        .btn-finish-top {
            background: var(--success); color: #fff; border: none; padding: 9px 14px;
            border-radius: 10px; font-weight: 800; font-size: 0.84rem; cursor: pointer; transition: all 0.2s;
        }
        .btn-finish-top.incomplete {
            background: rgba(252, 109, 2, 0.16); color: var(--accent); border: 1px solid rgba(252, 109, 2, 0.45);
        }

        /* Botão Flutuante de Layout */
        .floating-layout-btn {
            position: fixed; bottom: 20px; right: 20px; width: 52px; height: 52px; border-radius: 50%;
            background: var(--card-solid); border: 2px solid var(--accent); color: var(--accent);
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
            box-shadow: 0 6px 24px rgba(252, 109, 2, 0.4); cursor: pointer; z-index: 90; transition: transform 0.2s;
        }
        .floating-layout-btn:active { transform: scale(0.92); }

        /* Calendário */
        .calendar-card {
            background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 16px; margin-bottom: 18px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .cal-month-title { font-size: 0.95rem; font-weight: 800; color: #fff; text-transform: capitalize; }
        .cal-nav-btn {
            background: #0A0B0E; border: 1px solid var(--card-border); color: var(--accent);
            width: 32px; height: 32px; border-radius: 9px; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 600; border-radius: 10px; background: rgba(10, 11, 14, 0.72);
            color: var(--text-muted); position: relative; border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .cal-day.today { border-color: var(--accent); color: #fff; box-shadow: 0 0 10px rgba(252, 109, 2, 0.25); }
        .cal-day.trained { background: rgba(16, 185, 129, 0.18); border-color: var(--success); color: #fff; font-weight: 800; }
        .cal-day.trained::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--success); position: absolute; bottom: 4px; }
        .cal-summary-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.07); font-size: 0.75rem; color: var(--text-muted); }

        .workout-choice-card {
            background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 18px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
        }
        .workout-choice-card:active { transform: translateY(-1px); border-color: var(--accent); }

        /* Cartão de Exercício */
        .exercise-card {
            background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 16px; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
            transition: all 0.2s ease;
        }
        .exercise-card.minimized { padding: 12px 16px; opacity: 0.75; background: rgba(18, 19, 23, 0.6); }
        .exercise-card.minimized .exercise-body-content { display: none; }
        .exercise-card.focus-mode { border-color: var(--accent); box-shadow: 0 0 25px rgba(252, 109, 2, 0.3); }

        .exercise-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; cursor: pointer; }
        .exercise-name { font-size: 1.1rem; font-weight: 900; color: #fff; margin-bottom: 2px; letter-spacing: -0.015em; }
        .exercise-meta { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

        /* Layout Compacto / Lista */
        .exercise-card.compact-mode .set-row { padding: 6px 8px; margin-bottom: 6px; }
        .exercise-card.compact-mode .exercise-meta { display: none; }

        .progression-panel {
            background: rgba(8, 9, 12, 0.84); border: 1px solid rgba(252, 109, 2, 0.18);
            border-radius: 12px; padding: 10px; margin-bottom: 12px; font-size: 0.78rem;
        }
        .prev-sets-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
        .prev-chip { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 6px; padding: 3px 7px; font-size: 0.72rem; color: #E5E7EB; font-weight: 600; }
        .prev-chip span { color: var(--accent); font-weight: 800; }

        .set-row {
            display: grid; grid-template-columns: 26px 1fr 1fr 1fr 34px 34px; gap: 6px; align-items: center;
            margin-bottom: 8px; background: rgba(8, 9, 12, 0.68); padding: 8px;
            border-radius: 10px; border: 1px solid var(--card-border-subtle);
        }
        .set-row.completed { border-color: var(--success); background: rgba(16, 185, 129, 0.08); }
        .set-row.pending-highlight { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
        .set-number { font-weight: 800; text-align: center; color: var(--accent); font-size: 0.8rem; }
        .set-input-group { display: flex; flex-direction: column; }
        .set-input-group label { font-size: 0.58rem; color: var(--text-muted); margin-bottom: 2px; text-transform: uppercase; font-weight: 700; }
        .set-input-group input, .rpe-selector-btn {
            background: #07080A; border: 1px solid rgba(255, 255, 255, 0.11); border-radius: 7px;
            color: #fff; padding: 6px 2px; text-align: center; font-size: 0.88rem; font-weight: 700; width: 100%; height: 34px;
        }
        .set-input-group input:focus { border-color: var(--accent); outline: none; }
        .rpe-selector-btn { cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 0.75rem; }
        .rpe-selector-btn.empty { color: var(--text-muted); }

        .btn-timer-set {
            background: rgba(252, 109, 2, 0.12); border: 1px solid rgba(252, 109, 2, 0.3); border-radius: 8px;
            width: 32px; height: 34px; display: flex; align-items: center; justify-content: center;
            color: var(--accent); cursor: pointer; font-size: 0.9rem; transition: background 0.15s;
        }
        .btn-timer-set:active { background: var(--accent); color: #000; }

        .btn-check-set {
            background: #07080A; border: 2px solid rgba(255, 255, 255, 0.16); border-radius: 50%;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); cursor: pointer; font-weight: 800; font-size: 0.8rem;
        }
        .set-row.completed .btn-check-set { background: var(--success); border-color: var(--success); color: #fff; }

        .wizard-nav { display: flex; gap: 10px; margin-top: 16px; }
        .btn-wizard { flex: 1; padding: 12px; border-radius: 11px; font-weight: 800; font-size: 0.9rem; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-prev { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); }
        .btn-next { background: var(--accent); color: #050505; box-shadow: 0 4px 16px var(--accent-glow); }
        .btn-next.ready-finish { background: var(--success); color: #fff; }

        /* Modal de Layout */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.84); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-card { background: var(--card-solid); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75); }
        .layout-option-btn {
            width: 100%; background: #0A0B0E; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
            padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            color: #fff; cursor: pointer; font-weight: 700; font-size: 0.9rem; text-align: left; transition: all 0.15s;
        }
        .layout-option-btn.selected { border-color: var(--accent); background: rgba(252, 109, 2, 0.12); color: var(--accent); }
        .layout-option-btn.disabled { opacity: 0.4; cursor: not-allowed; }

        /* Cronômetro Flutuante de Descanso */
        .rest-timer-banner {
            position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
            background: #181920; border: 2px solid var(--accent); border-radius: 30px;
            padding: 10px 20px; display: none; align-items: center; gap: 14px; z-index: 95;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <header id="mainHeader" style="display:none;">
        <div>
            <div class="brand-row">
                <span style="font-size: 0.68rem; font-weight: 900; color: #fff;">ANDREY FRANCO</span>
                <span class="brand-badge">AF PRO</span>
            </div>
            <div class="workout-title" id="workoutName">Treino</div>
            <div class="workout-subinfo">
                <div class="workout-timer" id="timerDisplay">00:00</div>
                <div class="workout-volume" id="volumeDisplay">0 kg</div>
            </div>
        </div>
        <button class="btn-finish-top" id="btnFinishTop" onclick="handleFinishRequest()">Terminar</button>
    </header>

    <div id="workoutSelectionContainer"></div>
    <div id="workoutActiveContainer" style="display:none;"></div>

    <!-- Botão flutuante de Layout -->
    <div class="floating-layout-btn" id="floatingLayoutBtn" style="display:none;" onclick="openLayoutModal()">⚙️</div>

    <!-- Banner de Descanso Flutuante -->
    <div class="rest-timer-banner" id="restTimerBanner">
        <div>
            <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Descanso</div>
            <div id="restCountdownText" style="font-size: 1.1rem; font-weight: 900; color: var(--accent);">00:00</div>
        </div>
        <button onclick="cancelRestTimer()" style="background: rgba(239,68,68,0.2); border: 1px solid var(--danger); color: var(--danger); border-radius: 50%; width: 28px; height: 28px; font-weight: 800; cursor: pointer;">✕</button>
    </div>

    <!-- Modal de Layout -->
    <div class="modal-overlay" id="layoutModal" onclick="closeLayoutModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div style="font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Layout de Treino</div>
            <div style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 16px;">Escolha como deseja visualizar os exercícios:</div>
            
            <div id="layoutOptionsList"></div>

            <div style="margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px;">
                <label class="layout-option-btn" id="autoMinimizeOption" style="margin-bottom:0;">
                    <div>
                        <div>Recolher concluídos</div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); font-weight: 400;">Minimiza o exercício ao terminar as séries</div>
                    </div>
                    <input type="checkbox" id="autoMinimizeCheck" onchange="toggleAutoMinimize(this.checked)" style="width: 18px; height: 18px; accent-color: var(--accent);">
                </label>
            </div>
            <button onclick="closeLayoutModal()" style="width:100%; background:var(--accent); color:#050505; border:none; padding:12px; border-radius:12px; font-weight:800; margin-top:16px; cursor:pointer;">Concluído</button>
        </div>
    </div>

    <!-- Modal RPE -->
    <div class="modal-overlay" id="rpeModal" onclick="closeRpeModal()">
        <div class="modal-card" style="text-align: left;" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div>
                    <h3 style="font-size: 1.05rem; font-weight: 800; color: #fff;">Selecione o RPE (1 a 10)</h3>
                    <p style="font-size: 0.75rem; color: var(--text-muted);">Esforço percebido na série</p>
                </div>
                <button onclick="closeRpeModal()" style="background:none; border:none; color:#9CA3AF; font-size:1.3rem; cursor:pointer;">✕</button>
            </div>
            <div id="rpeOptionsList" style="max-height: 55vh; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Modal Finalizar / Resumo -->
    <div class="modal-overlay" id="finishModal" onclick="closeFinishModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div style="font-size: 2rem; text-align: center; margin-bottom: 8px;">🏆</div>
            <div style="font-size: 1.2rem; font-weight: 800; text-align: center; color: #fff; margin-bottom: 4px;">Salvar Treino?</div>
            <div style="font-size: 0.84rem; color: var(--text-muted); text-align: center; margin-bottom: 16px;" id="finishModalDesc"></div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button style="background: var(--success); color: #fff; padding: 13px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer;" onclick="saveAndFinishWorkout()">Salvar no Calendário</button>
                <button style="background: rgba(255,255,255,0.08); color: #fff; padding: 11px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer;" onclick="closeFinishModal()">Continuar Treinando</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dzifzikdeojazyswjguw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6aWZ6aWtkZW9qYXp5c3dqZ3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTg3NjgsImV4cCI6MjEwODk5NDc2OH0.Y3rycAN_O1IL99OdMJsC_TRMrSEKJp4vQJho2P4D_W0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const RPE_LEVELS = [
            { val: 10, title: "Máximo Absoluto", desc: "Falha total. 0 repetições na reserva." },
            { val: 9,  title: "Extremamente Difícil", desc: "Sobrou 1 repetição na reserva." },
            { val: 8,  title: "Muito Difícil", desc: "Poderia fazer 2 reps a mais." },
            { val: 7,  title: "Difícil / Intenso", desc: "Poderia fazer 3 reps a mais." },
            { val: 6,  title: "Moderado a Intenso", desc: "Ritmo firme." },
            { val: 5,  title: "Moderado", desc: "Esforço sustentável." }
        ];

        let alunoData = null;
        let treinosDisponiveis = [];
        let workoutData = null;
        let secondsElapsed = 0;
        let timerInterval = null;
        let currentExerciseIndex = 0;
        let activeSetForRpe = null;

        // Preferências de Layout
        let currentLayout = 'cards'; // 'cards', 'list', 'compact', 'focus'
        let autoMinimizeEnabled = true;

        // Cronômetro de Descanso
        let restTimerInterval = null;
        let restSecondsRemaining = 0;

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function initApp() {
            if (!token) {
                document.getElementById('workoutSelectionContainer').innerHTML = '<p style="text-align:center; color:#9CA3AF; padding: 40px;">Link inválido ou expirado.</p>';
                return;
            }
            try {
                const { data, error } = await supabaseClient.from('alunos').select('*').eq('token', token).single();
                if (error || !data) return;
                alunoData = data;
                treinosDisponiveis = Array.isArray(data.treinos) ? data.treinos : [];
                renderHome();
            } catch (err) {
                console.error(err);
            }
        }

        function renderHome() {
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('floatingLayoutBtn').style.display = 'none';
            const selContainer = document.getElementById('workoutSelectionContainer');
            selContainer.style.display = 'block';
            document.getElementById('workoutActiveContainer').style.display = 'none';

            let html = `
                <div style="margin-bottom: 20px;">
                    <h2 style="font-size: 1.3rem; font-weight: 900; color: #fff;">Olá, ${alunoData.nome.split(' ')[0]}</h2>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Escolha o treino de hoje:</p>
                </div>
            `;

            if (treinosDisponiveis.length === 0) {
                html += '<p style="color:var(--text-muted); text-align:center;">Nenhum treino cadastrado.</p>';
            } else {
                treinosDisponiveis.forEach((t, idx) => {
                    html += `
                        <div class="workout-choice-card" onclick="startWorkout(${idx})">
                            <div>
                                <div style="font-weight: 800; font-size: 1.05rem; color: #fff;">${t.nome}</div>
                                <div style="font-size: 0.78rem; color: var(--text-muted); margin-top:2px;">${(t.exercicios || []).length} exercícios</div>
                            </div>
                            <div style="background:var(--accent); color:#050505; font-weight:900; font-size:0.78rem; padding:8px 12px; border-radius:10px;">Iniciar →</div>
                        </div>
                    `;
                });
            }
            selContainer.innerHTML = html;
        }

        function startWorkout(index) {
            const t = treinosDisponiveis[index];
            workoutData = {
                id: t.id,
                name: t.nome,
                exercises: t.exercicios.map(e => ({
                    name: e.nome,
                    muscle: e.musculo || '',
                    equipment: e.equipamento || '',
                    descanso: parseInt(e.descanso) || 60, // Tempo de descanso em segundos vindo do admin
                    exigeRpe: e.exigeRpe !== false,
                    sets: Array.from({ length: parseInt(e.qtdSeries) || 4 }, () => ({
                        weight: '', reps: '', repsMeta: '10-12', rpe: '', done: false, minimized: false
                    }))
                }))
            };

            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('floatingLayoutBtn').style.display = 'flex';
            document.getElementById('workoutSelectionContainer').style.display = 'none';
            document.getElementById('workoutActiveContainer').style.display = 'block';
            document.getElementById('workoutName').innerText = workoutData.name;

            secondsElapsed = 0;
            startTimer();
            renderActiveWorkout();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const s = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${m}:${s}`;
            }, 1000);
        }

        function calculateTotalVolume() {
            let total = 0;
            if (!workoutData) return 0;
            workoutData.exercises.forEach(ex => {
                ex.sets.forEach(s => {
                    if (s.done) {
                        const w = parseFloat(s.weight) || 0;
                        const r = parseInt(s.reps, 10) || 0;
                        total += w * r;
                    }
                });
            });
            return total;
        }

        function updateVolumeDisplay() {
            const vol = calculateTotalVolume();
            document.getElementById('volumeDisplay').innerText = `${vol.toLocaleString('pt-BR')} kg`;
        }

        function renderActiveWorkout() {
            updateVolumeDisplay();
            const container = document.getElementById('workoutActiveContainer');
            const totalEx = workoutData.exercises.length;

            let html = '';
            workoutData.exercises.forEach((ex, exIdx) => {
                if (currentLayout === 'focus' && exIdx !== currentExerciseIndex) return;

                const allSetsDone = ex.sets.every(s => s.done);
                const isMinimized = (autoMinimizeEnabled && allSetsDone && currentLayout !== 'focus') || ex.minimized;
                
                let cardClass = 'exercise-card';
                if (isMinimized) cardClass += ' minimized';
                if (currentLayout === 'compact') cardClass += ' compact-mode';
                if (currentLayout === 'focus') cardClass += ' focus-mode';

                html += `
                    <div class="${cardClass}" id="ex-card-${exIdx}">
                        <div class="exercise-header" onclick="toggleMinimizeExercise(${exIdx})">
                            <div>
                                <div class="exercise-name">${ex.name}</div>
                                <div class="exercise-meta">${ex.muscle} ${ex.equipment ? '• ' + ex.equipment : ''} • Descanso: ${ex.descanso}s</div>
                            </div>
                            <div style="font-size:0.75rem; color:var(--accent); font-weight:800;">
                                ${isMinimized ? 'Expandir ▾' : (currentLayout === 'focus' ? `${exIdx + 1}/${totalEx}` : 'Minimizar ▴')}
                            </div>
                        </div>

                        <div class="exercise-body-content">
                            <div class="sets-list">
                `;

                ex.sets.forEach((set, sIdx) => {
                    html += `
                        <div class="set-row ${set.done ? 'completed' : ''}" id="set-row-${exIdx}-${sIdx}">
                            <div class="set-number">${sIdx + 1}</div>
                            <div class="set-input-group">
                                <label>Peso</label>
                                <input type="number" inputmode="decimal" value="${set.weight}" placeholder="0" onchange="updateSet(${exIdx}, ${sIdx}, 'weight', this.value)">
                            </div>
                            <div class="set-input-group">
                                <label>Reps</label>
                                <input type="number" inputmode="numeric" value="${set.reps}" placeholder="12" onchange="updateSet(${exIdx}, ${sIdx}, 'reps', this.value)">
                            </div>
                            <div class="set-input-group">
                                <label>RPE</label>
                                <button type="button" class="rpe-selector-btn ${set.rpe ? '' : 'empty'}" onclick="openRpe(${exIdx}, ${sIdx})">${set.rpe ? 'RPE ' + set.rpe : 'RPE'}</button>
                            </div>
                            <button type="button" class="btn-timer-set" onclick="triggerRestTimer(${ex.descanso})" title="Descanso">⏱️</button>
                            <button type="button" class="btn-check-set" onclick="toggleSetDone(${exIdx}, ${sIdx})">✓</button>
                        </div>
                    `;
                });

                html += `
                            </div>
                        </div>
                    </div>
                `;
            });

            if (currentLayout === 'focus') {
                html += `
                    <div style="display:flex; gap:10px; margin-top:16px;">
                        <button class="btn-wizard btn-prev" ${currentExerciseIndex === 0 ? 'disabled' : ''} onclick="changeFocusEx(-1)">Anterior</button>
                        <button class="btn-wizard btn-next" ${currentExerciseIndex === totalEx - 1 ? 'disabled' : ''} onclick="changeFocusEx(1)">Próximo</button>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function updateSet(exIdx, sIdx, field, val) {
            workoutData.exercises[exIdx].sets[sIdx][field] = val;
            updateVolumeDisplay();
        }

        function toggleSetDone(exIdx, sIdx) {
            const set = workoutData.exercises[exIdx].sets[sIdx];
            set.done = !set.done;
            renderActiveWorkout();
            
            // Se concluiu a série, inicia o cronômetro automaticamente se desejar
            if (set.done) {
                triggerRestTimer(workoutData.exercises[exIdx].descanso);
            }
        }

        function toggleMinimizeExercise(exIdx) {
            if (currentLayout === 'focus') return;
            workoutData.exercises[exIdx].minimized = !workoutData.exercises[exIdx].minimized;
            renderActiveWorkout();
        }

        function changeFocusEx(dir) {
            currentExerciseIndex += dir;
            renderActiveWorkout();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- SISTEMA DE CRONÔMETRO DE DESCANSO & VIBRAÇÃO ---
        function triggerRestTimer(seconds) {
            if (restTimerInterval) clearInterval(restTimerInterval);
            restSecondsRemaining = seconds || 60;
            
            const banner = document.getElementById('restTimerBanner');
            banner.style.display = 'flex';
            updateRestBannerText();

            restTimerInterval = setInterval(() => {
                restSecondsRemaining--;
                updateRestBannerText();
                if (restSecondsRemaining <= 0) {
                    clearInterval(restTimerInterval);
                    banner.style.display = 'none';
                    // Dispara vibração no celular do aluno (suporta Android e iOS moderno)
                    if ("vibrate" in navigator) {
                        navigator.vibrate([200, 100, 200, 100, 400]);
                    }
                }
            }, 1000);
        }

        function updateRestBannerText() {
            const m = Math.floor(restSecondsRemaining / 60).toString().padStart(2, '0');
            const s = (restSecondsRemaining % 60).toString().padStart(2, '0');
            document.getElementById('restCountdownText').innerText = `${m}:${s}`;
        }

        function cancelRestTimer() {
            if (restTimerInterval) clearInterval(restTimerInterval);
            document.getElementById('restTimerBanner').style.display = 'none';
        }

        // --- MODAL DE LAYOUT ---
        function openLayoutModal() {
            const list = document.getElementById('layoutOptionsList');
            const layouts = [
                { id: 'cards', name: 'Cartões', desc: 'Visualização padrão detalhada' },
                { id: 'list', name: 'Lista', desc: 'Exibição em lista contínua' },
                { id: 'compact', name: 'Compacta', desc: 'Economiza espaço na tela' },
                { id: 'focus', name: 'Foco', desc: 'Um exercício por vez em tela cheia' }
            ];

            list.innerHTML = layouts.map(l => `
                <button type="button" class="layout-option-btn ${currentLayout === l.id ? 'selected' : ''}" onclick="selectLayout('${l.id}')">
                    <div>
                        <div style="font-weight: 800;">${l.name}</div>
                        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: 400;">${l.desc}</div>
                    </div>
                    <div>${currentLayout === l.id ? '✓' : ''}</div>
                </button>
            `).join('');

            // Trava o recolhimento automático se estiver no modo Foco
            const autoMinChk = document.getElementById('autoMinimizeCheck');
            const autoMinBox = document.getElementById('autoMinimizeOption');
            autoMinChk.checked = autoMinimizeEnabled;
            if (currentLayout === 'focus') {
                autoMinBox.classList.add('disabled');
                autoMinChk.disabled = true;
            } else {
                autoMinBox.classList.remove('disabled');
                autoMinChk.disabled = false;
            }

            document.getElementById('layoutModal').style.display = 'flex';
        }

        function closeLayoutModal() {
            document.getElementById('layoutModal').style.display = 'none';
        }

        function selectLayout(layoutName) {
            currentLayout = layoutName;
            if (currentLayout === 'focus') {
                autoMinimizeEnabled = false; // Foco desativa recolhimento automático conforme solicitado
            }
            openLayoutModal();
            renderActiveWorkout();
        }

        function toggleAutoMinimize(val) {
            if (currentLayout === 'focus') return;
            autoMinimizeEnabled = val;
            renderActiveWorkout();
        }

        // --- RPE & FINALIZAÇÃO ---
        function openRpe(exIdx, sIdx) {
            activeSetForRpe = { exIdx, sIdx };
            const list = document.getElementById('rpeOptionsList');
            list.innerHTML = RPE_LEVELS.map(r => `
                <button type="button" style="width:100%; background:#08090C; border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:10px; margin-bottom:6px; text-align:left; color:#fff; cursor:pointer;" onclick="setRpeVal(${r.val})">
                    <strong style="color:var(--accent);">RPE ${r.val}</strong> - ${r.title}
                    <div style="font-size:0.72rem; color:var(--text-muted);">${r.desc}</div>
                </button>
            `).join('');
            document.getElementById('rpeModal').style.display = 'flex';
        }

        function setRpeVal(val) {
            if (activeSetForRpe) {
                workoutData.exercises[activeSetForRpe.exIdx].sets[activeSetForRpe.sIdx].rpe = val;
                renderActiveWorkout();
            }
            closeRpeModal();
        }

        function closeRpeModal() { document.getElementById('rpeModal').style.display = 'none'; }

        function handleFinishRequest() {
            const vol = calculateTotalVolume();
            document.getElementById('finishModalDesc').innerText = `Volume total levantado: ${vol.toLocaleString('pt-BR')} kg. Deseja registrar e salvar o treino no seu histórico?`;
            document.getElementById('finishModal').style.display = 'flex';
        }

        function closeFinishModal() { document.getElementById('finishModal').style.display = 'none'; }

        async function saveAndFinishWorkout() {
            if (timerInterval) clearInterval(timerInterval);
            const nowIso = new Date().toISOString();
            const vol = calculateTotalVolume();
            
            try {
                const hist = Array.isArray(alunoData.historico) ? [...alunoData.historico] : [];
                hist.push({
                    data: nowIso,
                    treinoNome: workoutData.name,
                    volume: vol,
                    exercicios: workoutData.exercises
                });
                await supabaseClient.from('alunos').update({ historico: hist }).eq('id', alunoData.id);
                alunoData.historico = hist;
            } catch(e) { console.error(e); }

            closeFinishModal();
            alert('Treino salvo com sucesso!');
            renderHome();
        }

        window.onload = initApp;
    </script>
</body>
</html>

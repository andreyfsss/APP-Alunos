<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AF Pro - Treino do Atleta</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050505; }
        .bg-af-card { background-color: #151515; }
        .text-af-orange { color: #FF6A00; }
        .bg-af-orange { background-color: #FF6A00; }
        .border-af-orange { border-color: #FF6A00; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Header Andrey Franco Personal -->
    <header class="bg-af-card border-b border-slate-800 sticky top-0 z-20">
        <div class="max-w-md mx-auto p-3 flex justify-between items-center">
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="font-black text-lg text-white tracking-tighter">ANDREY FRANCO</span>
                    <span class="font-black text-[10px] text-af-orange tracking-widest bg-orange-950/60 px-1.5 py-0.5 rounded border border-orange-600/40">PERSONAL</span>
                </div>
                <h1 id="nome-aluno" class="font-bold text-xs text-slate-300">Carregando atleta...</h1>
            </div>
            <button onclick="carregarDadosAluno()" class="bg-black hover:bg-slate-900 text-slate-300 p-2 rounded-xl border border-slate-800 text-xs transition-all">🔄</button>
        </div>
    </header>

    <!-- Barra Flutuante de Descanso -->
    <div id="bar-timer-descanso" class="hidden fixed top-16 left-0 right-0 z-30 bg-orange-950/95 border-b border-af-orange backdrop-blur p-3 shadow-2xl">
        <div class="max-w-md mx-auto flex justify-between items-center text-xs">
            <span class="text-white font-bold flex items-center gap-1.5">
                ⏱️ Descanso: <span id="display-tempo-timer" class="text-sm text-af-orange font-black">01:30</span>
            </span>
            <button id="btn-folego-extra" onclick="adicionarTempoTimer(30)" class="bg-black text-af-orange text-[10px] px-2.5 py-1 rounded-lg font-bold border border-slate-800">+30s Fôlego (1x)</button>
        </div>
    </div>

    <!-- MODAL DE EXPLICAÇÃO DO MÉTODO DE TREINO (Aparece ao clicar no método) -->
    <div id="modal-explicacao-metodo" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-af-card border border-af-orange/40 p-5 rounded-2xl max-w-xs w-full space-y-3 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 id="titulo-modal-metodo" class="font-black text-sm text-af-orange uppercase">MÉTODO DE TREINO</h3>
                <button onclick="fecharModalMetodo()" class="text-xs text-slate-400 font-bold">✕ Fechar</button>
            </div>
            <p id="texto-modal-metodo" class="text-xs text-slate-200 leading-relaxed"></p>
            <button onclick="fecharModalMetodo()" class="w-full bg-af-orange text-black font-black py-2 rounded-xl text-xs">Entendi, Vamos Treinar!</button>
        </div>
    </div>

    <!-- MODAL RPE -->
    <div id="modal-rpe-fullscreen" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden z-50 flex flex-col justify-between p-5">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <div>
                <span class="text-[10px] uppercase font-bold text-af-orange">Escala de Esforço Percebido</span>
                <h3 class="text-base font-bold text-white">Selecione o RPE</h3>
            </div>
            <button onclick="fecharRPEFullScreen()" class="bg-black text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-800">✕ Fechar</button>
        </div>

        <div class="grid grid-cols-1 gap-2.5 my-auto max-w-sm w-full mx-auto">
            <button onclick="selecionarRPE('10')" class="bg-af-card hover:border-af-orange border border-slate-800 p-3 rounded-2xl text-left"><div class="font-bold text-sm text-af-orange">RPE 10 - Falha Total</div><p class="text-[10px] text-slate-400">0 repetições na reserva (Esforço Máximo)</p></button>
            <button onclick="selecionarRPE('9')" class="bg-af-card hover:border-af-orange border border-slate-800 p-3 rounded-2xl text-left"><div class="font-bold text-sm text-af-orange">RPE 9 - 1 Rep na Reserva</div><p class="text-[10px] text-slate-400">Muito difícil, aguentaria apenas mais 1</p></button>
            <button onclick="selecionarRPE('8')" class="bg-af-card hover:border-af-orange border border-slate-800 p-3 rounded-2xl text-left"><div class="font-bold text-sm text-af-orange">RPE 8 - 2 Reps na Reserva</div><p class="text-[10px] text-slate-400">Carga pesada com boa técnica</p></button>
            <button onclick="selecionarRPE('7')" class="bg-af-card hover:border-af-orange border border-slate-800 p-3 rounded-2xl text-left"><div class="font-bold text-sm text-af-orange">RPE 7 - Moderado</div><p class="text-[10px] text-slate-400">Movimento rápido e muito controlado</p></button>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-md w-full mx-auto p-3 md:p-4 space-y-4 pb-24">
        
        <div id="view-divisoes-aluno" class="space-y-3">
            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-400 px-1">Selecione Seu Treino de Hoje</h2>
            <div id="container-lista-divisoes" class="space-y-2.5">
                <p class="text-xs text-slate-600 text-center py-6">Carregando divisões...</p>
            </div>
        </div>

        <!-- EXECUÇÃO DE TREINO -->
        <div id="view-execucao-treino" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-af-card border border-slate-800 rounded-2xl p-3">
                <button onclick="voltarParaDivisoes()" class="bg-black text-slate-400 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-800">← Trocar Treino</button>
                <h2 id="titulo-divisao-ativa" class="font-bold text-xs text-af-orange uppercase tracking-wider">Treino</h2>
            </div>

            <div class="bg-af-card border border-slate-800 rounded-2xl p-3.5 flex justify-between items-center text-xs">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-400 block">Volume Total da Sessão</span>
                    <strong class="text-slate-200">Cargas x Repetições</strong>
                </div>
                <span class="text-af-orange font-black text-base" id="volume-total-aluno">0 kg</span>
            </div>

            <div id="lista-exercicios-aluno" class="space-y-4"></div>

            <button onclick="finalizarTreinoAluno()" class="w-full bg-af-orange hover:bg-orange-600 font-black py-3.5 rounded-2xl transition-all shadow-lg text-black text-xs">
                Finalizar e Registrar Treino 🚀
            </button>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://dzifzikdeojazyswjguw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6aWZ6aWtkZW9qYXp5c3dqZ3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTg3NjgsImV4cCI6MjEwODk5NDc2OH0.Y3rycAN_O1IL99OdMJsC_TRMrSEKJp4vQJho2P4D_W0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let inputRPEAtivo = null;
        let timerInterval = null;
        let tempoRestante = 0;
        let folegoUtilizado = false;
        let treinosDoAlunoCarregados = [];

        const explicacoesMetodos = {
            'Drop Set': 'O Drop-Set consiste em fazer a série até a falha, reduzir a carga em aproximadamente 20% imediatamente (sem descanso) e continuar fazendo repetições até a falha novamente.',
            'Rest Pause': 'No Rest-Pause, você faz a série até a falha, dá um pequeno descanso de 10 a 15 segundos sem mudar a carga e faz mais algumas repetições até falhar de novo.',
            'Cluster Set': 'No Cluster Set, a série é dividida em pequenos blocos de poucas repetições com descansos curtos de 10 a 20s entre eles, permitindo usar cargas mais elevadas.',
            'Pirâmide Crescente': 'Na Pirâmide Crescente, você aumenta o peso e diminui o número de repetições a cada série realizada.',
            'Pirâmide Decrescente': 'Na Pirâmide Decrescente, você começa com a carga mais pesada e reduz o peso aumentando o número de repetições nas séries seguintes.',
            'FST-7': 'O FST-7 é um protocolo de 7 séries consecutivas com intervalos bem curtos (30 a 45s) com foco em alongar a fáscia muscular e maximizar o bombeamento sanguíneo.'
        };

        function mostrarExplicacaoMetodo(nomeMetodo) {
            const texto = explicacoesMetodos[nomeMetodo] || 'Série configurada pelo seu personal trainer.';
            document.getElementById('titulo-modal-metodo').innerText = nomeMetodo;
            document.getElementById('texto-modal-metodo').innerText = texto;
            document.getElementById('modal-explicacao-metodo').classList.remove('hidden');
        }

        function fecharModalMetodo() {
            document.getElementById('modal-explicacao-metodo').classList.add('hidden');
        }

        function validarApenasNumeros(input) {
            input.value = input.value.replace(/[^0-9.]/g, '');
            calcularVolumeTotal();
        }

        async function carregarDadosAluno() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (!token) return;
            try {
                const { data: aluno, error } = await supabaseClient.from('alunos').select('*').eq('token', token).single();
                if (error || !aluno) return;
                document.getElementById('nome-aluno').innerText = aluno.nome;
                treinosDoAlunoCarregados = aluno.treinos || [];
                renderizarDivisoesTreino(treinosDoAlunoCarregados);
            } catch (err) { }
        }

        function renderizarDivisoesTreino(treinos) {
            const container = document.getElementById('container-lista-divisoes');
            if (treinos.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Nenhum treino prescrito ainda.</p>`;
                return;
            }
            container.innerHTML = treinos.map(t => `
                <div onclick="abrirExecucaoTreino('${t.id}')" class="bg-af-card border border-slate-800 hover:border-af-orange/50 rounded-2xl p-4 flex justify-between items-center cursor-pointer transition-all shadow-sm">
                    <div>
                        <h3 class="font-bold text-sm text-af-orange uppercase tracking-wider">${t.nome}</h3>
                        <p class="text-[10px] text-slate-500 mt-0.5">${t.exercicios.length} exercício(s)</p>
                    </div>
                    <span class="text-xs text-black font-black bg-af-orange px-3 py-1.5 rounded-xl">Iniciar →</span>
                </div>
            `).join('');
        }

        function abrirExecucaoTreino(treinoId) {
            const treino = treinosDoAlunoCarregados.find(t => t.id === treinoId);
            if (!treino) return;
            document.getElementById('titulo-divisao-ativa').innerText = treino.nome;
            renderizarExerciciosAluno(treino.exercicios);
            document.getElementById('view-divisoes-aluno').classList.add('hidden');
            document.getElementById('view-execucao-treino').classList.remove('hidden');
            calcularVolumeTotal();
        }

        function voltarParaDivisoes() {
            document.getElementById('view-execucao-treino').classList.add('hidden');
            document.getElementById('view-divisoes-aluno').classList.remove('hidden');
        }

        function alternarColapsoExercicio(cabecalhoElement) {
            const cardBody = cabecalhoElement.nextElementSibling;
            const seta = cabecalhoElement.querySelector('.seta-toggle');
            cardBody.classList.toggle('hidden');
            if (seta) seta.style.transform = cardBody.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        function renderizarExerciciosAluno(exercicios) {
            const container = document.getElementById('lista-exercicios-aluno');
            container.innerHTML = exercicios.map((ex, index) => {
                const htmlSeries = ex.seriesConfig.map(s => {
                    const possuiExplicacao = s.metodo !== 'Normal';
                    const badgeMetodoHTML = `
                        <div onclick="event.stopPropagation(); ${possuiExplicacao ? `mostrarExplicacaoMetodo('${s.metodo}')` : ''}" class="bg-black border border-slate-800 px-2 py-0.5 rounded-lg text-[9px] text-slate-300 flex items-center gap-1 ${possuiExplicacao ? 'cursor-pointer hover:border-af-orange' : ''}">
                            <span class="text-slate-500 uppercase">Método:</span>
                            <strong class="text-af-orange font-bold">${s.metodo}</strong>
                            ${possuiExplicacao ? '<span class="text-[9px] text-af-orange">ℹ️</span>' : ''}
                        </div>
                    `;

                    return `
                        <div class="bg-black border border-slate-800 p-2.5 rounded-xl space-y-2 serie-item">
                            <div class="flex items-center gap-1.5">
                                <span class="w-4 text-center font-bold text-[11px] text-slate-400">${s.num}ª</span>
                                ${badgeMetodoHTML}
                                ${s.metodo !== 'Drop Set' ? `
                                <button onclick="dispararTimerDescanso(${s.descanso || 90})" class="ml-auto bg-black hover:bg-slate-900 text-af-orange border border-slate-800 text-[10px] px-2 py-1 rounded-lg font-bold">⏱️ ${s.descanso || 90}s</button>` : ''}
                            </div>

                            <!-- 4 CAIXINHAS LADO A LADO DA MESMA ALTURA -->
                            <div class="grid grid-cols-4 gap-1.5 items-center">
                                <div class="bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-center" title="Treino Anterior">
                                    <span class="block text-[7px] text-slate-500 uppercase font-bold">Anterior</span>
                                    <span class="text-[10px] font-bold text-slate-300">30kg x 10</span>
                                </div>
                                <input type="number" step="0.5" oninput="validarApenasNumeros(this)" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-center text-xs font-bold text-white focus:border-af-orange focus:outline-none input-carga" placeholder="kg">
                                <input type="number" oninput="validarApenasNumeros(this)" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-center text-xs font-bold text-white focus:border-af-orange focus:outline-none input-reps" placeholder="reps">
                                <input readonly onclick="abrirRPEFullScreen(this)" type="text" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-center text-xs font-bold text-af-orange cursor-pointer focus:outline-none" placeholder="RPE">
                            </div>
                        </div>`;
                }).join('');

                return `
                    <div class="bg-af-card border border-slate-800 rounded-2xl overflow-hidden shadow-md">
                        <div onclick="alternarColapsoExercicio(this)" class="p-3.5 bg-af-card flex justify-between items-center cursor-pointer select-none hover:bg-slate-900/50">
                            <div>
                                <span class="text-[9px] font-bold uppercase tracking-wider text-af-orange">${ex.musculo} • ${ex.equipamento}</span>
                                <h3 class="font-bold text-xs text-slate-100">${index + 1}. ${ex.nome}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[9px] bg-black text-slate-400 px-2 py-0.5 rounded border border-slate-800">${ex.qtdSeries} Séries</span>
                                <span class="seta-toggle text-xs text-slate-400 transition-transform duration-200" style="transform: rotate(180deg);">▼</span>
                            </div>
                        </div>
                        <div class="p-2.5 border-t border-slate-800 space-y-2 bg-af-card">${htmlSeries}</div>
                    </div>`;
            }).join('');
        }

        function calcularVolumeTotal() {
            let volumeTotal = 0;
            document.querySelectorAll('.serie-item').forEach(serie => {
                const cargaInput = serie.querySelector('.input-carga');
                const repsInput = serie.querySelector('.input-reps');
                if (cargaInput && repsInput) {
                    const carga = parseFloat(cargaInput.value) || 0;
                    const reps = parseFloat(repsInput.value) || 0;
                    volumeTotal += carga * reps;
                }
            });
            document.getElementById('volume-total-aluno').innerText = `${volumeTotal.toLocaleString('pt-BR')} kg`;
        }

        function abrirRPEFullScreen(inputElement) {
            inputRPEAtivo = inputElement;
            document.getElementById('modal-rpe-fullscreen').classList.remove('hidden');
        }
        function fecharRPEFullScreen() {
            document.getElementById('modal-rpe-fullscreen').classList.add('hidden');
            inputRPEAtivo = null;
        }
        function selecionarRPE(valor) {
            if (inputRPEAtivo) inputRPEAtivo.value = valor;
            fecharRPEFullScreen();
        }
        function dispararTimerDescanso(segundos) {
            tempoRestante = segundos;
            folegoUtilizado = false;
            const btnFolego = document.getElementById('btn-folego-extra');
            btnFolego.classList.remove('hidden', 'opacity-40', 'cursor-not-allowed');
            btnFolego.innerText = '+30s Fôlego (1x)';
            btnFolego.disabled = false;
            document.getElementById('bar-timer-descanso').classList.remove('hidden');
            atualizarDisplayTimer();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                tempoRestante--;
                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    fecharTimerDescanso();
                } else {
                    atualizarDisplayTimer();
                }
            }, 1000);
        }
        function atualizarDisplayTimer() {
            const min = Math.floor(tempoRestante / 60);
            const sec = tempoRestante % 60;
            document.getElementById('display-tempo-timer').innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }
        function adicionarTempoTimer(secs) {
            if (folegoUtilizado) return;
            folegoUtilizado = true;
            tempoRestante += secs;
            atualizarDisplayTimer();
            const btnFolego = document.getElementById('btn-folego-extra');
            btnFolego.classList.add('opacity-40', 'cursor-not-allowed');
            btnFolego.innerText = 'Fôlego Usado';
            btnFolego.disabled = true;
        }
        function fecharTimerDescanso() {
            clearInterval(timerInterval);
            document.getElementById('bar-timer-descanso').classList.add('hidden');
        }
        async function finalizarTreinoAluno() {
            alert('Treino registrado com sucesso!');
            window.location.reload();
        }
        window.onload = carregarDadosAluno;
    </script>
</body>
</html>
